name: Автоматический релиз SwitchWave

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: switchwave-release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Определить версию
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep '^APP_VERSION' Makefile | sed 's/.*:=\s*//' | tr -d ' ')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Собрать образ сборщика
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: switchwave-builder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Собрать SwitchWave
        run: ./build-docker.sh

      - name: Подготовить стабильный SD-пакет
        id: package
        run: |
          set -euo pipefail
          SOURCE=$(find build -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$SOURCE"
          mkdir -p release
          cp "$SOURCE" release/SwitchWave.zip
          SHA256=$(sha256sum release/SwitchWave.zip | awk '{print $1}')
          {
            echo "sha256=$SHA256"
            echo 'notes<<EOF'
            echo "Автоматическая сборка из коммита \`${GITHUB_SHA::7}\`."
            echo
            echo "**SHA-256:** \`$SHA256\`"
            echo "**Артефакт:** один SD-готовый \`SwitchWave.zip\`."
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Создать тег только для новой версии
        run: |
          set -euo pipefail
          TAG='${{ steps.version.outputs.tag }}'
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name 'Dimasick-git'
            git config user.email 'dimaorynchukk@gmail.com'
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Создать или обновить GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SwitchWave ${{ steps.version.outputs.tag }}
          body: ${{ steps.package.outputs.notes }}
          files: release/SwitchWave.zip
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Оставить один основной asset
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          KEEP_ASSET: SwitchWave.zip
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            for (const asset of release.data.assets) {
              if (asset.name !== process.env.KEEP_ASSET) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }
            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
            });
            if (assets.data.length !== 1 || assets.data[0].name !== process.env.KEEP_ASSET) {
              throw new Error('Release must contain exactly one SwitchWave.zip asset.');
            }
